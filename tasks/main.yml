---
# tasks file for create-ansible-dev
- name: call assertions tasks
  ansible.builtin.include_tasks: assertions.yml

- name: bring in os specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: ensure the .vimrc file exists for every user
  with_nested:
    - "{{ create_ansible_dev_users }}"
    - "{{ create_ansible_dev_filepaths }}"
  ansible.builtin.copy:
    src: "{{ item[1]['vim_src'] }}"
    dest: "{{ item[0]['homedir'] }}/{{ item[1]['vim_dest'] }}"
    owner: "{{ item[0]['name'] }}"
    group: "{{ item[0]['name'] }}"
    mode: "0600"
    force: true
    backup: true

- name: ensure the ANSIBLE_FORCE_COLOR=1 environment variable exists for the user
  with_nested:
    - "{{ create_ansible_dev_users }}"
    - "{{ create_ansible_dev_filepaths }}"
    - "{{ create_ansible_dev_env_vars_line }}"
  when: item[0]['shell'] == item[1]['shell']
  ansible.builtin.lineinfile:
    path: "{{ item[0]['homedir'] }}/{{ item[1]['env_file'] }}"
    line: "{{ item[2] }}"
    backup: true
    state: present

- name: ensure developement directories exist
  with_nested:
    - "{{ create_ansible_dev_users }}"
    - "{{ create_ansible_dev_directories }}"
  ansible.builtin.file:
    path: "{{ item[0]['homedir'] }}/{{ item[1] }}"
    owner: "{{ item[0]['name'] }}"
    group: "{{ item[0]['name'] }}"
    mode: 0770
    state: directory

- name: include tasks to install additional ansible related or dev packages
  ansible.builtin.include_tasks: "{{ ansible_os_family }}-install-pkgs.yml"

- name: include_tasks to install pub/priv additional keys
  when: create_ansible_dev_env_misc_keys[0]['username'] is defined
  ansible.builtin.include_tasks: install-additional-keys.yml
  
- name: include tasks to modify ssh_config to work with misc keys
  when: create_ansible_dev_env_misc_keys[0]['username'] is defined 
  ansible.builtin.include_tasks: mod-ssh-for-misc-keys.yml

- name: include tasks to clone git repos
  when: create_ansible_dev_env_clone_repos == true
  ansible.builtin.include_tasks: clone-repos.yml

---
- name: ensure ansible dev public key exists
  loop:
    "{{ create_ansible_dev_users }}"
  ansible.builtin.copy:
    src: "{{ item['devuser_src_key_path'] }}/{{ item['devuser_pub_key_file'] }}"
    dest: "{{ item['homedir'] }}/.ssh/{{ item['devuser_pub_key_file'] }}"
    owner: "{{ item['name'] }}"
    group: "{{ item['name'] }}"
    mode: 0600

- name: ensure ansible dev private key exists
  loop:
    "{{ create_ansible_dev_users }}"
  ansible.builtin.copy:
    src: "{{ item['devuser_src_key_path'] }}/{{ item['devuser_priv_key_file'] }}"
    dest: "{{ item['homedir'] }}/.ssh/{{ item['devuser_priv_key_file'] }}"
    owner: "{{ item['name'] }}"
    group: "{{ item['name'] }}"
    mode: 0600

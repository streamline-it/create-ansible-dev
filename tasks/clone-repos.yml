---
- name: create base directory for git repos
  loop:
    "{{ create_ansible_dev_env_git_repos }}"
  ansible.builtin.file:
    path: "{{ item['dest_dir'] }}"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    state: directory

- name: check to see if repos exist and store result
  register: create_ansible_dev_env_repo_check
  loop:
    "{{ create_ansible_dev_env_git_repos }}"
  ansible.builtin.stat:
    path: "{{ item['dest_dir'] }}/{{ item['git_repo_name'] }}"
    get_attributes: true

- name: ensure git repo(s) are cloned if they don't exist
  debugger: on_failed
  loop: "{{ create_ansible_dev_env_git_repos | ansible.builtin.zip( create_ansible_dev_env_repo_check['results']) | list }}"
  loop_control:
    index_var: create_ansible_dev_env_index
  when:
    - item[1]['stat']['exists'] == false
  ansible.builtin.git:
    repo: "{{ item[0]['git_repo'] }}"
    dest: "{{ item[0]['dest_dir'] }}/{{ item[0]['git_repo_name'] }}"
    clone: true
    key_file: "/home/{{ item[0]['owner'] }}/.ssh/{{ item[0]['host_key'] }}"
    accept_hostkey: true

- name: ensure owner is set correctly for git repos
  loop:
    "{{ create_ansible_dev_env_git_repos }}"
  ansible.builtin.file:
    path: "{{ item['dest_dir'] }}/{{ item['git_repo_name'] }}"
    owner: "{{ item['owner'] }}"
    recurse: true

---
- name: ensure the config file exists 
  changed_when: false
  when:
    - create_ansible_dev_env_ssh_user_config is defined
    - create_ansible_dev_env_ssh_user_config[0]['username'] is truthy 
  loop:
    "{{ create_ansible_dev_env_ssh_user_config }}"
  ansible.builtin.copy:
    content: ""
    dest: "{{ item['config_filepath'] }}"
    owner: "{{ item['username'] }}"
    group: "{{ item['username'] }}"
    mode: "0600"

- name: ensure the contents are created for the user's ssh config file
  loop:
    "{{ create_ansible_dev_env_ssh_user_config }}"
  loop_control:
    index_var: create_ansible_dev_env_loop_index
  when: 
    - create_ansible_dev_env_ssh_user_config[create_ansible_dev_env_loop_index]['username'] is truthy 
  ansible.builtin.blockinfile:
    path: "{{ item['config_filepath'] }}"
    block: |
      host {{ item['host_domain'] }}
          hostname {{ item['host_name'] }}
          IdentityFile {{ item['identity_file'] }}
    state: present

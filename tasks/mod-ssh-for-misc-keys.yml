---
- name: check to see if the ssh config exists
  register: create_ansible_dev_env_check_config_exists
  debugger: on_failed
  when:
    - create_ansible_dev_env_ssh_create_user_config == true
    - create_ansible_dev_env_ssh_user_config is defined
    - create_ansible_dev_env_ssh_user_config[0]['username'] is truthy 
  changed_when: false
  loop:
    "{{ create_ansible_dev_env_ssh_user_config }}"
  ansible.builtin.stat:
    path: "{{ item['config_filepath'] }}"
    get_attributes: true

- name: ensure the config file exists 
  changed_when: false
  loop:
    "{{ create_ansible_dev_env_check_config_exists['results'] | ansible.builtin.zip(create_ansible_dev_env_ssh_user_config) | list }}"
  when:
    - create_ansible_dev_env_ssh_user_config is defined
    - create_ansible_dev_env_ssh_user_config[0]['username'] is truthy 
    - item[0]['stat']['exists'] == false
  ansible.builtin.copy:
    content: ""
    dest: "{{ item[1]['config_filepath'] }}"
    owner: "{{ item[1]['username'] }}"
    group: "{{ item[1]['username'] }}"
    mode: "0600"

- name: ensure the contents are created for the user's ssh config file
  loop:
    "{{ create_ansible_dev_env_ssh_user_config }}"
  loop_control:
    index_var: create_ansible_dev_env_loop_index
  when: 
    - create_ansible_dev_env_ssh_user_config[create_ansible_dev_env_loop_index]['username'] is truthy 
  ansible.builtin.blockinfile:
    path: "{{ item['config_filepath'] }}"
    block: |
      host {{ item['host_domain'] }}
          hostname {{ item['host_name'] }}
          IdentityFile {{ item['identity_file'] }}
    state: present

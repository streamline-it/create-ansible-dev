---
- name: ensure key variables exist for default setup
  ansible.builtin.assert:
    that:
      - create_ansible_dev_users is defined
      - create_ansible_dev_users is truthy
      - create_ansible_dev_directories is defined
      - create_ansible_dev_directories is truthy
      - create_ansible_dev_env_vars_line is defined
      - create_ansible_dev_env_vars_line is truthy
    fail_msg: >
      "Make sure the following variables exist and are defined"

- name: ensure repo variable is setup if setup repo variable is enabled
  when: create_ansible_dev_env_clone_repos == true
  ansible.builtin.assert:
    that:
      - create_ansible_dev_env_git_repos is defined
      - create_ansible_dev_env_git_repos is truthy
    fail_msg: "Make sure git repo variables are set"

- name: ensure variables are defined for misc public/private keys
  when: create_ansible_dev_env_use_misc_keys == true
  ansible.builtin.assert:
    that:
      - create_ansible_dev_env_misc_keys is defined
      - create_ansible_dev_env_misc_keys is truthy
    fail_msg: "These variable(s) must be setup"

- name: ensure ssh config file exists if enabled
  when: create_ansible_dev_env_create_ssh_config == true
  ansible.builtin.assert:
    that:
      - create_ansible_dev_env_ssh_user_config is defined
      - create_ansible_dev_env_ssh_user_config is truthy
    fail_msg: "Ensure variable(s) for ssh user config are setup"

- name: check to see if user's exist
  register: create_ansible_dev_env_user_check 
  changed_when: false
  failed_when: false
  loop:
    "{{ create_ansible_dev_users }}"
  ansible.builtin.stat:
    path: "{{ item['homedir'] }}"
    get_attributes: true

- name: ensure the home directory(s) exist
  loop:
    "{{ create_ansible_dev_env_user_check['results'] }}"
  ansible.builtin.assert:
    that: item['stat']['exists']
    fail_msg: "All user profiles must exist."

- name: ensure bash prompt colors are defined
  ansible.builtin.assert:
    that: 
      - create_ansible_dev_prompt_colors is defined
      - create_ansible_dev_prompt_colors is truthy
    fail_msg: "Make sure prompt colors list is defined"

- name: ensure the choice to configure the bash prompt is setup properly
  ansible.builtin.assert:
    that:
      - create_ansible_dev_bash_config_prompt is defined
      - create_ansible_dev_bash_config_prompt == true or create_ansible_dev_bash_config_prompt == false
    fail_msg: "make sure this variable is setup correctly"

- name: if we're configuring the bash prompt make sure key variables are set
  when: create_ansible_dev_bash_config_prompt == true
  ansible.builtin.assert:
    that: 
      - create_ansible_dev_prompt_string is defined
      - create_ansible_dev_prompt_string is truthy
      - create_ansible_dev_ps_prompt is defined
      - create_ansible_dev_ps_prompt is truthy
      - create_ansible_dev_chosen_color is defined
      - create_ansible_dev_chosen_color is truthy
    fail_msg: "Make sure all variables related to BASH prompt are defined"

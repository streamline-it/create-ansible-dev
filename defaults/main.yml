---
# defaults file for create-ansible-dev

create_ansible_dev_users:
  - name:
    shell:
    homedir:
    wallpaper: 
    devuser_src_key_path:
    devuser_priv_key_file:
    devuser_pub_key_file:

# directories to create for ansible developement
create_ansible_dev_directories:
  - Documents/ansible_dev/playbooks

# environment variable(s) to create
create_ansible_dev_env_vars_line:
  - "export ANSIBLE_FORCE_COLOR=True"

# if true the role will setup misc pub/priv keys
create_ansible_dev_env_use_misc_keys: false

# other pub/private keys to add
create_ansible_dev_env_misc_keys:
  - username:
    user_home_dir:
    priv_key_filename:
    pub_key_filename:
    key_dest_dir:
    key_src_dir:
    mode: 

# controls assertions specificc to ssh config file for the user
create_ansible_dev_env_create_ssh_config: false

create_ansible_dev_env_ssh_user_config:
  - username: 
    config_filepath: 
    host_domain:
    host_name:
    identity_file:

# if enabled asserts will check that 
# variables specific to git cloning are
# setup
create_ansible_dev_env_clone_repos: false

# Git repo setup variable
create_ansible_dev_env_git_repos:
  - git_repo_name:
    git_repo:
    dest_dir:
    owner: 
    group:

---
# defaults file for create-ansible-dev

# the "bash_ps1" attribute will change the bash prompt.
#
create_ansible_dev_prompt_colors:
  - black: 30
  - red: 31
  - green: 32
  - yellowbrown: 33
  - blue: 34
  - magenta: 35
  - cyan: 36
  - lightgrey: 37
  - default: 39
  - darkgrey: 90
  - white: 97


# This will help choose the color of your prompt in the bash shell, default is green
# This is the example of the end result "PS1="\e[1;32m\][\u@\h: \w]$\e[0m\]"

create_ansible_dev_chosen_color: "{{ create_ansible_dev_prompt_colors[1]['green'] }}"
create_ansible_dev_prompt_string: "\\[\\e[1;{{ create_ansible_dev_chosen_color }}m\\]⌠[\\u@\\h: \\w]\n└\\[\\e[1;{{ create_ansible_dev_chosen_color }}m\\]─$ \\[\\e[0m\\]"
create_ansible_dev_ps_prompt: "{{ 'PS1=\"' ~ create_ansible_dev_prompt_string ~  '\"' }}"

# if true the bash config prompt
create_ansible_dev_bash_config_prompt: true

# for os attribute (linux or bsd)
# for shell bash or bourne
create_ansible_dev_users:
  - name:
    os: 
    shell: 
    homedir:
    bash_ps1: 

# directories to create for ansible developement
create_ansible_dev_directories:
  - Documents/ansible_dev/playbooks

# environment variable(s) to create
create_ansible_dev_env_vars_line:
  - "export ANSIBLE_FORCE_COLOR=True"

# if true the role will setup misc pub/priv keys
create_ansible_dev_env_use_misc_keys: false

# other pub/private keys to add
create_ansible_dev_env_misc_keys:
  - username:
    user_home_dir:
    priv_key_filename:
    pub_key_filename:
    key_dest_dir:
    key_src_dir:
    mode: 

# controls assertions specificc to ssh config file for the user
create_ansible_dev_env_create_ssh_config: false

create_ansible_dev_env_ssh_user_config:
  - username: 
    config_filepath: 
    host_domain:
    host_name:
    identity_file:

# if enabled asserts will check that 
# variables specific to git cloning are
# setup
create_ansible_dev_env_clone_repos: false

# Git repo setup variable
create_ansible_dev_env_git_repos:
  - git_repo_name:
    git_repo:
    dest_dir:
    owner: 
    group:
